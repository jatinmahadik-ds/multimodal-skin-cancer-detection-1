<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Profile · Vireo Clinical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" width="18" height="18"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="4"/></svg>
      </span>
      Vireo Clinical
    </div>
    <nav>
      <a href="dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Dashboard
      </a>
      <a href="predict.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/><circle cx="12" cy="12" r="4"/></svg>
        AI Prediction
      </a>
      <a href="patients.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        Patients
      </a>
      <a href="reports.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h6"/></svg>
        Reports
      </a>
      <div class="nav-section-label">Account</div>
      <a href="profile.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/></svg>
        Profile
      </a>
      <a href="#" class="nav-item" data-logout>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Logout
      </a>
    </nav>
    <div class="sidebar-foot">Vireo Clinical v0.9 · Prototype</div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="flex" style="align-items:center; gap:14px;">
        <button class="menu-toggle" aria-label="Toggle menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div>
          <h1 class="page-title">Doctor Profile</h1>
          <div class="page-date" data-current-date></div>
        </div>
      </div>
      <div class="topbar-right">
        <div class="doctor-chip">
          <div class="avatar" data-doctor-initials>DR</div>
          <div>
            <div class="name" data-doctor-name>Doctor</div>
            <div class="role" data-doctor-role>Specialization</div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="card card-pad" id="profileView">
        <div class="profile-header">
          <div class="profile-avatar" data-doctor-initials>DR</div>
          <div style="flex:1;">
            <h2 data-doctor-name style="margin-bottom:2px;">Doctor</h2>
            <p class="text-muted mono" data-doctor-spec style="margin:0;">Specialization</p>
          </div>
          <button class="btn btn-outline" id="editProfileBtn">Edit Profile</button>
        </div>

        <div class="info-grid">
          <div class="info-item">
            <div class="info-label">Registration Number</div>
            <div class="info-value mono" data-doctor-reg>—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Specialization</div>
            <div class="info-value" data-doctor-spec>—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Hospital / Clinic</div>
            <div class="info-value" data-doctor-hospital>—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Email</div>
            <div class="info-value" data-doctor-email>—</div>
          </div>
          <div class="info-item">
            <div class="info-label">Phone</div>
            <div class="info-value" data-doctor-phone>—</div>
          </div>
        </div>
      </div>

      <div class="card card-pad" id="profileEdit" style="display:none; max-width:600px;">
        <h2 style="margin-bottom:18px;">Edit Profile</h2>
        <form id="profileEditForm" novalidate>
          <div class="field">
            <label for="editName">Doctor Full Name</label>
            <input type="text" id="editName">
          </div>
          <div class="field">
            <label for="editSpecialization">Specialization</label>
            <input type="text" id="editSpecialization">
          </div>
          <div class="field">
            <label for="editHospital">Hospital / Clinic Name</label>
            <input type="text" id="editHospital">
          </div>
          <div class="field">
            <label for="editPhone">Phone Number</label>
            <input type="tel" id="editPhone">
          </div>
          <div class="flex gap-12">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <button type="button" class="btn btn-ghost" id="cancelEditBtn">Cancel</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="js/script.js"></script>
<script>requireAuth();</script>
</body>
</html>
